# Single entry point. Browser -> :8080 -> this proxy -> authentication | backend | frontend
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Using variables in proxy_pass makes nginx resolve names at request time,
    # so the proxy still starts even if a container (e.g. frontend) is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # most specific first: /api/auth/* -> authentication service
    location /api/auth/ {
        set $auth_upstream authentication:4001;
        proxy_pass http://$auth_upstream;   # no URI part: the original path is forwarded unchanged
    }

    # everything else under /api/ -> clinic backend
    location /api/ {
        set $backend_upstream backend:4002;
        proxy_pass http://$backend_upstream;
    }

    # everything else -> React app served by nginx
    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
    }
}